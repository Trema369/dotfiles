"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000
palette = "catppuccin_mocha"

# ── PROMPT LAYOUT ─────────────────────────────

format = """
$directory$character
"""

right_format = """
$git_branch$git_status $aws$golang$dotnet
"""

# ── CHARACTER ─────────────────────────────────

[character]
vicmd_symbol =":"
success_symbol = "[➜](bold green)"

# ── DIRECTORY ─────────────────────────────────

[directory]
read_only = " 󰌾"

[directory.substitutions]
"~/tests/starship-custom" = "work-project"

# ── GIT (defaults overridden with your icons) ─

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style)"

[git_commit]
tag_symbol = "  "

[git_status]
conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
staged = "● "
deleted = "✘ "
modified = "◆ "
renamed = "➜ "
untracked = "… "


[hg_branch]
symbol = " "

[fossil_branch]
symbol = " "

[pijul_channel]
symbol = " "

# ── AWS ───────────────────────────────────────

[aws]
symbol = " "
style = "bold blue"
disabled = false
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'

# ── LANGUAGES / RUNTIMES ──────────────────────

[dotnet]
symbol = "󰪮 "
style = "bold lavender"
heuristic = true
format = "[$symbol]($style)"

[golang]
symbol = " "
format = "[ ](bold cyan)"

# ── DISABLED MODULES ──────────────────────────

[kubernetes]
disabled = true
symbol = "☸ "

[docker_context]
disabled = true
symbol = " "

